name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform 37
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list | grep -i "platforms;android-3[67]" || true
          "$SDKM" "platforms;android-37" || "$SDKM" "platforms;android-37.0" || true
          echo "Installed platforms:"
          ls "$SDK/platforms"
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -d "$SDK/platforms/android-37" ]; then
            mv "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
            sed -i 's/android-37\.0/android-37/g' "$SDK/platforms/android-37/package.xml"
          fi
          ls "$SDK/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: digital-library-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      
